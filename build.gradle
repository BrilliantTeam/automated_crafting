import java.text.SimpleDateFormat

plugins {
    id 'java'
    id 'idea'
}

group 'com.aeltumn'
version '2.6.2'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
compileJava.options.encoding = 'UTF-8'

ext {
    minecraftVersion = '26.3.build.181-stable'
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = "CodeMC"
        url = uri("https://repo.codemc.io/repository/maven-public/")
    }
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url 'https://libraries.minecraft.net/' }
}

dependencies {
    // General Compilation Only Dependencies
    compileOnly "io.papermc.paper:paper-api:${minecraftVersion}"
    compileOnly "de.tr7zw:item-nbt-api-plugin:2.14.1"
    compileOnly group: 'com.mojang', name: 'authlib', version: '1.5.21'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.7'
}

jar {
    manifest {
        attributes(
                'Implementation-Version': version,
                'Implementation-Vendor': "Aeltumn",
                'Built-By': System.properties['user.name'],
                'Build-Timestamp': new SimpleDateFormat("HH:mm dd-MM-yyyy").format(new Date()),
                'Created-By': "Gradle ${gradle.gradleVersion}",
                'Build-Jdk': "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
                'Build-OS': "${System.properties['os.name']} ${System.properties['os.arch']} ${System.properties['os.version']}"
        )
    }
}
